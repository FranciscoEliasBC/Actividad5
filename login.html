<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema | Iniciar Sesión</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">

    <div class="contenedor-login">
        <div class="card-login">
            <div class="text-center mb-4">
                <div class="contenedor-icono-login">
                    <i class="bi bi-shield-lock icono-login"></i>
                </div>
                <h1 class="h4 fw-bold mt-2 mb-1">Acceso al Sistema</h1>
                <p class="text-muted small">Ingresa tus credenciales para continuar.</p>
            </div>

            <form id="formulario-login" novalidate>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="text" id="correo" class="form-control" placeholder="correo@ejemplo.com" autocomplete="off">
                    <span id="error-correo" class="mensaje-error"></span>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Tu contraseña" autocomplete="off">
                    <span id="error-password" class="mensaje-error"></span>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2" id="btn-login">Iniciar sesión</button>
                <p id="mensaje-exito" class="mensaje-exito text-center mt-3"></p>
            </form>
        </div>
    </div>

    <script src="js/utileria.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
